server:
  port: 8081

spring:
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://localhost:3306/mark?useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM sys_user
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,log4j
      connection-properties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 3000MB
      max-request-size: 100MB
  mvc:
    static-path-pattern: /images/**
  jackson:
    default-property-inclusion: always

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.qczy.model.entity.*
  global-config:
    db-config:
      id-type: auto
  configuration:
    auto-mapping-behavior: partial
    map-underscore-to-camel-case: true

jwt:
  tokenHeader: Authorization
  secret: mySecret
  expiration: 604800
  tokenHead: Bearer

upload:
  port: http:127.0.0.1:8080/temp/file/
  address: http:127.0.0.1:8080/
  tempPath: F:/mark_linshi/qczyDataMark/temp/
  formalPath: F:/mark_linshi/qczyDataMark/formal/
  zipPath: F:/mark_linshi/qczyDataMark/tempZip/
  modelDescPath: F:/mark_linshi/qczyDataMark/file/modelDesc/
  modelCasePath: F:/mark_linshi/qczyDataMark/file/modelCase/
  pdfPath: F:/mark_linshi/qczyDataMark/file/pdf/
  paramsJsonPath: F:/mark_linshi/qczyDataMark/file/paramsJson/

flower:
  runner:
    base-url: http://10.129.45.44:9000
    # The following paths are interpreted on the Python runner host.
    app-dir: linux_flower_demo
    runs-dir: linux_flower_demo/runs
    datasets-root: linux_flower_demo/allDatasets
    sync-interval-ms: 5000

file:
  accessAddress: http://192.168.0.107:8080/formal/
  accessAddress1: http://192.168.0.107:8080/formal/
  versionFormat: /v

monitor:
  server: http://192.168.1.4:8080/monitor/server

flask:
  algorithmPicHttp: http://192.168.1.4
  algorithmPicHttp1: http://192.168.1.4/data
  prefixToRemove: /home/taizun
  prefixToRemove1: /data
