flower:
  server:
    remote:
      base-url: http://10.129.45.44:9000
      resnet-app-dir: linux_flower_demo
    port: 8088                                   # Flower Server 榛樿绔彛锛堜細鑷姩閫掑閬垮厤鍐茬獊锛?
