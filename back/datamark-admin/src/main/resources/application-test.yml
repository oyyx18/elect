federated:
  node:
    heartbeat:
      timeout: 30000                                 # 鑺傜偣蹇冭烦瓒呮椂鏃堕棿锛堢锛?
  training:
    default:
      num-rounds: 10                              # 榛樿璁粌杞暟
      min-clients: 2                              # 榛樿鏈?灏戝鎴风鏁?
      allowed-drop-percent: 5.0                   # 鍏佽绮惧害涓嬮檷鐧惧垎姣?
  strategy:
    fedavg:
      enabled: true                               # 鍚敤 FedAvg 绛栫暐
    fedprox:
      enabled: true                               # 鍚敤 FedProx 绛栫暐
      proximal-mu: 0.01                           # FedProx 杩戠椤圭郴鏁?




