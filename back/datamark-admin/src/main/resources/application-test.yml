#   ---------------- 鐢熶骇鐜 ----------------

server:
  #鏈嶅姟绔彛
  port: 8081


spring:
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://localhost:3306/mark?useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      # 鍒濆鍖栧ぇ灏忥紝鏈?灏忥紝鏈?澶?
      initial-size: 5
      min-idle: 5
      max-active: 20
      # 閰嶇疆鑾峰彇杩炴帴绛夊緟瓒呮椂鐨勬椂闂?
      max-wait: 60000
      # 閰嶇疆闂撮殧澶氫箙鎵嶈繘琛屼竴娆℃娴嬶紝妫?娴嬮渶瑕佸叧闂殑绌洪棽杩炴帴锛屽崟浣嶆绉?
      time-between-eviction-runs-millis: 60000
      # 閰嶇疆涓?涓繛鎺ュ湪姹犱腑鏈?灏忕敓瀛樻椂闂?
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM sys_user
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 鎵撳紑 PSCache锛屽苟涓旀寚瀹氭瘡涓繛鎺ヤ笂 PSCache 鐨勫ぇ灏?
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 閰嶇疆鐩戞帶缁熻鎷︽埅鐨?Filter锛屽幓鎺夊悗鐩戞帶鐣岄潰 SQL 鏃犳硶缁熻锛寃all 鐢ㄤ簬闃茬伀澧?
      filters: stat,wall,log4j
      # 閫氳繃 connection-properties 灞炴?ф墦寮? mergeSql 鍔熻兘锛涙參 SQL 璁板綍
      connection-properties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000

  #閬囧埌鍚屾牱鍚嶅瓧鐨勬椂鍊欒鐩栨敞鍐?
  main:
    allow-bean-definition-overriding: true
# Swagger 閰嶇疆锛堢敓浜х幆澧冪鐢紝鍜屼箣鍓嶇殑澶氱幆澧冮?昏緫鍛煎簲锛?


  servlet:
    multipart:
      max-file-size: 3000MB
      max-request-size: 100MB
  mvc:
    static-path-pattern: /images/**

  jackson:
    default-property-inclusion: always  # 搴忓垪鍖栨椂鍖呭惈鎵?鏈夊瓧娈碉紙鍖呮嫭null鍊硷級

mybatis-plus:
  #  mapper-locations: classpath:/qczy/**/*.xml #鎸囧畾mapper.xml璺緞
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.qczy.model.entity.*
  global-config:
    db-config:
      id-type: auto #鍏ㄥ眬榛樿涓婚敭绫诲瀷璁剧疆涓鸿嚜澧?
  configuration:
    auto-mapping-behavior: partial #鍙闈炲祵濂楃殑 resultMap 杩涜鑷姩鏄犲皠
    map-underscore-to-camel-case: true #寮?鍚嚜鍔ㄩ┘宄板懡鍚嶈鍒欐槧灏?
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


# 鑷畾涔塲wt key
jwt:
  tokenHeader: Authorization #JWT瀛樺偍鐨勮姹傚ご
  secret: mySecret #JWT鍔犺В瀵嗕娇鐢ㄧ殑瀵嗛挜
  expiration: 604800 #JWT鐨勮秴鏈熼檺鏃堕棿(60*60*24)
  tokenHead: Bearer  #JWT璐熻浇涓嬁鍒板紑澶碿d

upload:
  port: http:127.0.0.1:8080/temp/file/  #鐢ㄤ簬杩斿洖缁欏墠绔闂复鏃舵枃浠剁殑璁块棶璺緞
  address: http:127.0.0.1:8080/
  tempPath: F:/mark_linshi/qczyDataMark/temp/  #涓存椂鏂囦欢澶瑰瓨鍌ㄤ綅缃?
  formalPath: F:/mark_linshi/qczyDataMark/formal/ # 姝ｅ紡鏂囦欢澶瑰瓨鍌ㄤ綅缃?
  zipPath: F:/mark_linshi/qczyDataMark/tempZip/
  modelDescPath: F:/mark_linshi/qczyDataMark/file/modelDesc/ #妯″瀷璇勪及 - 妯″瀷API鎺ュ彛璇存槑瀛樻斁浣嶇疆
  modelCasePath: F:/mark_linshi/qczyDataMark/file/modelCase/ #妯″瀷妗堜緥 - 妯″瀷妗堜緥瀛樻斁浣嶇疆
  pdfPath: F:/mark_linshi/qczyDataMark/file/pdf/ #pdf鐢宠鍗?- pdf鐢宠鍗曞瓨鏀句綅缃?
  paramsJsonPath: F:/mark_linshi/qczyDataMark/file/paramsJson/ #鍙傛暟鏂囦欢 - 鍙傛暟鏂囦欢瀛樻斁浣嶇疆


